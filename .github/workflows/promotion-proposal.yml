name: promotion-proposal

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  workflow_run:
    # a branch gaining packages is what makes the next one promotable
    workflows: [apply-manifest, build-publish]
    types: [completed]

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: promotion-proposal
      cancel-in-progress: false
    strategy:
      # sequential: the stable proposal must see any testing manifest the
      # testing proposal just wrote
      max-parallel: 1
      matrix:
        branch: [testing, stable]
    steps:
      - name: mint an app token
        # app-authored commits are signed by github; a PAT's are not
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install boto3 pyyaml
      - name: propose ${{ matrix.branch }} promotion
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/propose_promotion.py \
            --repo "${{ github.repository }}" \
            --branch "${{ matrix.branch }}"
