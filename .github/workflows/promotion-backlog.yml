name: promotion-backlog

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  workflow_run:
    # the backlog changes whenever a branch does
    workflows: [build-publish, promote, repo-remove]
    types: [completed]

jobs:
  sync:
    runs-on: ubuntu-24.04
    # the built-in token can be granted issue writes here, unlike the PAT
    permissions:
      issues: write
    concurrency:
      group: promotion-backlog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install boto3
      - name: sync backlog issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/promotion_backlog.py --repo "${{ github.repository }}"
