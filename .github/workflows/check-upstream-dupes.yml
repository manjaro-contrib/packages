name: check-upstream-dupes

on:
  schedule:
    # weekly: a package appearing upstream is not urgent, but going
    # unnoticed for months means shipping a needless duplicate
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - packages.yml
      - scripts/check_upstream_dupes.py
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: check-upstream-dupes
      cancel-in-progress: false
    steps:
      - name: mint an app token
        # the app carries issues: write; github.token would need the
        # permission granted per workflow and cannot label across the org
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install pyyaml
      - name: check against the arch repositories
        # reports into a labelled issue rather than failing: a package
        # appearing upstream deserves a decision, not a red check
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 scripts/check_upstream_dupes.py \
            --issue "${{ github.repository }}" 2>&1 | tee /tmp/report.txt
      - name: summarise
        run: |
          {
            echo '## Packages Arch now ships'
            echo
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
