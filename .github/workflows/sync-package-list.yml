name: sync-package-list

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the drift without opening a pull request
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: sync-package-list
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install pyyaml
      - name: propose unlisted packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_package_list.py \
            --repo "${{ github.repository }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
