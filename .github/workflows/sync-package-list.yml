name: sync-package-list

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the drift without opening a pull request
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: sync-package-list
      cancel-in-progress: false
    steps:
      - name: mint an app token
        # app-authored commits are signed by github; a PAT's are not
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        run: pip install pyyaml
      - name: propose unlisted packages
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 scripts/sync_package_list.py \
            --repo "${{ github.repository }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
