name: build-publish

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: restrict to a single package repository name
        required: false
  repository_dispatch:
    types: [package_update]

env:
  REPO_URL: ${{ vars.REPO_URL }}
  BRANCH: unstable

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # a version built for one architecture can be missing for the other,
      # so each gets its own list
      pending: ${{ steps.check.outputs.pending }}
      has_pending: ${{ steps.check.outputs.has_pending }}
      more_waves: ${{ steps.check.outputs.more_waves }}
    steps:
      - name: mint an app token
        # app-authored commits and releases are signed by github
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          ONLY_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
        run: |
          pending='[]'
          more=false
          for arch in x86_64 aarch64; do
            args=(--org "${{ github.repository_owner }}" --repo-url "$REPO_URL" \
                  --branch "$BRANCH" --arch "$arch")
            [ -n "$ONLY_REPO" ] && args+=(--only-repo "$ONLY_REPO")
            all=$(python3 scripts/check_updates.py "${args[@]}")
            # build only the first wave: later waves depend on packages this
            # run publishes, so they cannot resolve until it finishes
            wave0=$(jq -c --arg a "$arch" '[.[] | select(.wave == 0) | .arch = $a]' <<<"$all")
            pending=$(jq -c -s 'add' <<<"$pending$wave0")
            [ "$(jq 'any(.[]; .wave > 0)' <<<"$all")" = true ] && more=true
          done
          {
            echo "pending=$pending"
            echo "has_pending=$(jq 'length > 0' <<<"$pending")"
            echo "more_waves=$more"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.has_pending == 'true'
    # native, not emulated: makepkg under qemu is slow enough to change
    # what a build costs
    runs-on: ${{ matrix.package.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      # the builder user and toolchain are baked in
      image: ghcr.io/${{ github.repository }}/builder:latest
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check.outputs.pending) }}
    steps:
      - name: enable the contrib repo for dependency resolution
        # packages here depend on each other - flashfocus needs
        # python-xpybutil - and those exist in no upstream manjaro repo
        env:
          GPG_KEYID: ${{ vars.GPG_KEYID }}
          KEY_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/gpg-public-key.asc
        run: |
          curl -fsSL "$KEY_URL" -o /tmp/contrib.asc
          pacman-key --init
          pacman-key --add /tmp/contrib.asc
          pacman-key --lsign-key "$GPG_KEYID"
          # the section name is the database name, so each repository needs
          # its own; $repo and $arch are expanded by pacman, not the shell
          # shellcheck disable=SC2016
          for repo in core extra multilib; do
            printf '\n[%s]\nSigLevel = Required DatabaseRequired\nServer = %s/%s/$repo/$arch\n' \
              "$repo" "$REPO_URL" "$BRANCH" >> /etc/pacman.conf
          done
          pacman -Sy --noconfirm
      - name: mint an app token
        # app-authored commits and releases are signed by github
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builder
      - name: reuse released build
        # this exact version was built before; republishing the stored
        # binary keeps the repo byte-identical and skips a recompile
        if: matrix.package.reusable
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p pkg
          python3 builder/scripts/release_store.py download \
            --repo "${{ matrix.package.repo }}" \
            --version "${{ matrix.package.version }}" \
            --artifacts "${{ join(matrix.package.artifacts, ',') }}" \
            --pkg-dir pkg
      - name: checkout package source
        if: ${{ !matrix.package.reusable }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.package.repo }}
          ref: ${{ matrix.package.default_branch }}
          token: ${{ steps.app.outputs.token }}
          path: pkg
      - name: import signing key
        if: ${{ !matrix.package.reusable }}
        env:
          GPG_SECRET_BASE64: ${{ secrets.GPG_SECRET_BASE64 }}
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: |
          # makepkg signs as the unprivileged builder, so the key has to
          # land in that user's keyring, not root's
          install -d -o builder -g builder /home/builder/.gnupg
          sudo -u builder env \
            GPG_SECRET_BASE64="$GPG_SECRET_BASE64" GPG_KEYID="$GPG_KEYID" \
            builder/scripts/import_key.sh
      - name: import upstream source keys
        # PKGBUILDs that verify a release signature need the author's key in
        # the builder keyring, or makepkg aborts before building
        if: ${{ !matrix.package.reusable }}
        run: |
          chown -R builder:builder pkg
          keys=$(sed -n "s/^[[:space:]]*validpgpkeys=(//p; /validpgpkeys=(/,/)/p" pkg/PKGBUILD |
            grep -oE "[0-9A-Fa-f]{40}" || true)
          for key in $keys; do
            sudo -u builder gpg --keyserver keyserver.ubuntu.com --recv-keys "$key" ||
              echo "could not fetch $key; makepkg will report the failure"
          done
      - name: build
        if: ${{ !matrix.package.reusable }}
        env:
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: |
          cd pkg
          sudo -u builder makepkg -s --noconfirm --sign --key "$GPG_KEYID"
      - name: store build as release
        # the bucket only keeps the current version, so the release is the
        # only durable record of this binary
        if: ${{ !matrix.package.reusable }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 builder/scripts/release_store.py upload \
            --repo "${{ matrix.package.repo }}" \
            --version "${{ matrix.package.version }}" \
            --pkg-dir pkg
      - name: upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.package.arch }}-${{ matrix.package.pkgbase }}
          path: |
            pkg/*.pkg.tar.zst
            pkg/*.pkg.tar.zst.sig
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [check, build]
    strategy:
      # one at a time: both legs rewrite the shared state file
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    # needs.build.result is 'failure' if ANY matrix leg failed; run anyway so
    # partial successes still publish. publish.py fails if nothing was built.
    if: always() && needs.check.outputs.has_pending == 'true' && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    # repo-add must come from the same pacman generation that built the
    # packages; Ubuntu's build rejects them as "not a package file".
    container: docker://ghcr.io/${{ github.repository }}/repo:latest
    concurrency:
      # one shared group, not one per arch: the state file covers every
      # branch and arch, so two publishes must never overlap. With
      # cancel-in-progress false the second leg queues rather than dying,
      # and max-parallel keeps the ordering inside this run.
      group: repo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-${{ matrix.arch }}-*
          path: packages
          merge-multiple: true
      - name: is there anything for this architecture
        # the other architecture may have been the only one with work, and
        # publish.py treats an empty directory as a failure
        id: have
        run: |
          count=$(find packages -name '*.pkg.tar.zst' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "## ${{ matrix.arch }}: $count package(s) to publish"
      - name: import signing key
        if: steps.have.outputs.count != '0'
        env:
          GPG_SECRET_BASE64: ${{ secrets.GPG_SECRET_BASE64 }}
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: scripts/import_key.sh
      - name: publish to R2
        if: steps.have.outputs.count != '0'
        env:
          GPG_KEYID: ${{ vars.GPG_KEYID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/publish.py --pkg-dir packages --branch "$BRANCH" \
            --arch "${{ matrix.arch }}"
      - name: verify the branch resolves
        # the state hash changes for a partial upload exactly as it does
        # for a good one, so check the invariants a client depends on
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/check_repo.py --branch "$BRANCH" --arch "${{ matrix.arch }}"

  next-wave:
    needs: [check, publish]
    # the packages left over depend on what publish just uploaded, so a
    # fresh run recomputes them as wave 0 and builds them
    if: needs.check.outputs.more_waves == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    # the built-in token can be granted workflow dispatch here; the PAT
    # carries no Actions scope
    steps:
      - name: mint an app token
        # app-authored commits and releases are signed by github
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: dispatch the next wave
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh workflow run build-publish.yml --repo "${{ github.repository }}"
