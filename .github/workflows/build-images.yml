name: build-images

on:
  push:
    branches: [main]
    paths:
      - images/Containerfile
      - .github/workflows/build-images.yml
  schedule:
    # weekly, so the baked packages do not drift far behind the archive
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  build:
    # native per architecture rather than qemu: a pacman transaction under
    # emulation is slow enough to matter, and the base image already
    # publishes both
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [repo, builder]
        # aarch64 is not built: build-publish.yml publishes x86_64 only, so
        # an arm image would have no consumer. See the ARCHES note there and
        # #50. Adding it back here and there re-enables the pair.
        arch: [x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images
          file: images/Containerfile
          target: ${{ matrix.target }}
          build-args: |
            BUILDER_BASE=${{ matrix.arch == 'aarch64' && 'menci/archlinuxarm:base-devel' || 'manjarolinux/base:latest' }}
          push: true
          # one tag per architecture; the manifest below joins them, so a
          # job can pull :latest and get its own architecture
          tags: ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ matrix.arch }}
          # the base image moves under us, so never trust a cached layer
          no-cache: true

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        target: [repo, builder]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: point :latest at the architectures that were built
        # jobs pull :latest and expect their own architecture. With one
        # architecture this is a rename rather than a join, but it still has
        # to happen: nothing else creates :latest.
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.target }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:x86_64"
          docker buildx imagetools inspect "$IMAGE:latest"
