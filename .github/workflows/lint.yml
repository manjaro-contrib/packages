name: lint

on:
  pull_request:
    paths:
      - '**.py'
      - ruff.toml
      - .github/workflows/lint.yml
  push:
    branches: [main]
    paths:
      - '**.py'
      - ruff.toml
      - .github/workflows/lint.yml
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        # ruff's version is pinned in mise.toml: an unpinned linter turns
        # an upstream release into a failing build on an unrelated pull request
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
      - name: check
        run: ruff check --output-format github .
      - name: format
        # reports only - the scripts were not written under the formatter,
        # so enforcing it would be a reformat of every file rather than a check
        continue-on-error: true
        run: ruff format --check --diff .
