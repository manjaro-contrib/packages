name: sync-codeowners

on:
  push:
    branches: [main]
    paths:
      - packages.yml
      - scripts/sync_codeowners.py
      - .github/workflows/sync-codeowners.yml
  schedule:
    # catches repos created or edited outside a packages.yml change
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-codeowners
      cancel-in-progress: false
    steps:
      - name: mint an app token
        # app-authored commits are signed by github; a PAT's are not
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: sync CODEOWNERS into the package repos
        env:
          # writing into other repositories needs the cross-repo token
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          pip install pyyaml
          python3 scripts/sync_codeowners.py --org "${{ github.repository_owner }}"
