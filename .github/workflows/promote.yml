name: promote

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch (e.g. unstable)
        required: true
        default: unstable
      target_branch:
        description: Target branch (e.g. testing)
        required: true
        default: testing
      packages:
        description: Comma-separated package filenames, or ALL
        required: true

env:
  ARCH: x86_64

jobs:
  promote:
    runs-on: ubuntu-24.04
    # repo-add must match the pacman generation that built the packages
    container: docker://manjarolinux/base:latest
    concurrency:
      group: repo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install repo tooling
        run: pacman -Syu --noconfirm --needed pacman-contrib python python-boto3 gnupg
      - name: import signing key
        env:
          GPG_SECRET_BASE64: ${{ secrets.GPG_SECRET_BASE64 }}
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: scripts/import_key.sh
      - name: promote in R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: |
          python3 scripts/promote.py \
            --source-branch "${{ inputs.source_branch }}" \
            --target-branch "${{ inputs.target_branch }}" \
            --packages "${{ inputs.packages }}" \
            --arch "$ARCH"
