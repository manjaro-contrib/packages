name: check-sources

on:
  pull_request:
    paths:
      - packages.yml
      - patches/**
      - scripts/check_sources.py
  push:
    branches: [main]
    paths:
      - packages.yml
      - patches/**
      - scripts/check_sources.py
  schedule:
    # a package's PKGBUILD changes without touching this repository, and a
    # gitlab-sync mirror changes without anyone here doing anything at all
    - cron: '50 4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: mint an app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
      - name: install dependencies
        run: mise run install
      - name: reject a source fetched from gitlab.manjaro.org
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/check_sources.py --org "${{ github.repository_owner }}"
