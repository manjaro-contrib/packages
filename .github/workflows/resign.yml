name: resign

on:
  workflow_dispatch:
    inputs:
      branches:
        description: Comma-separated branches to re-sign
        required: true
        default: unstable,testing,stable
      dry_run:
        description: Report what would be re-signed
        type: boolean
        default: false

env:
  ARCH: x86_64

jobs:
  resign:
    runs-on: ubuntu-24.04
    container: docker://ghcr.io/${{ github.repository }}/repo:latest
    concurrency:
      group: repo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: import signing key
        if: ${{ !inputs.dry_run }}
        env:
          GPG_SECRET_BASE64: ${{ secrets.GPG_SECRET_BASE64 }}
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: scripts/import_key.sh
      - name: re-sign each branch
        env:
          GPG_KEYID: ${{ vars.GPG_KEYID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          IFS=, read -ra branches <<<"${{ inputs.branches }}"
          for branch in "${branches[@]}"; do
            python3 scripts/resign_branch.py --branch "$branch" --arch "$ARCH" \
              ${{ inputs.dry_run && '--dry-run' || '' }}
          done
