name: repo-remove

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names to remove
        required: true
      branches:
        description: Comma-separated branches to remove from
        required: true
        default: unstable,testing,stable
      arches:
        description: Comma-separated architectures
        required: true
        default: x86_64

jobs:
  remove:
    runs-on: ubuntu-24.04
    # repo-remove must match the pacman generation that wrote the database
    container: docker://manjarolinux/base:latest
    concurrency:
      group: repo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install repo tooling
        run: pacman -Syu --noconfirm --needed pacman-contrib python python-boto3
      - name: remove from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 scripts/repo_remove.py \
            --packages "${{ inputs.packages }}" \
            --branches "${{ inputs.branches }}" \
            --arches "${{ inputs.arches }}"
