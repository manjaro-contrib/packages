name = "manjaro-contrib-packages"
main = "src/index.js"
compatibility_date = "2026-09-04"
# the login sees several accounts; pin the one owning the bucket so a
# deploy can never bind an empty bucket on the wrong account
account_id = "ed740e1b87e525691b947ca317a3cb90"

# custom domain rather than a route: Cloudflare provisions the DNS record
# and certificate, and the zone lives in the same account as the worker
routes = [
  { pattern = "packages.manjaro.download", custom_domain = true },
]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "packages"
