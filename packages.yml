# Every package this repository builds.
#
# upstream: an external git repo to track; update-upstreams opens a PR
#   when it moves ahead. Omit it for packages maintained here, which
#   have no external source.
# maintainers: requested as reviewers on those PRs.
# override: why we ship a package arch already ships. Without this,
#   check-upstream-dupes reports it as redundant, since an overlay package
#   that duplicates the distribution only decides which one pacman picks.
# Never source from gitlab.manjaro.org. Clones of that host fail often
# enough to break builds outright, and a package sourced from it inherits
# that on every build. Mirrors of those repositories live in this
# organization; point the source at the mirror carrying the same revision,
# and name the clone target after the package so prepare() still finds it.
# patches: not a field. A directory patches/<repo-name>/ holding *.patch
#   is applied to the checkout before makepkg, and to the PKGBUILD text
#   when check_updates resolves the version. It exists for gitlab-sync
#   mirrors, which are force-pushed, so a fix committed to the package
#   repository is overwritten within two hours.
# floating: why a package must track a moving branch tip rather than a
#   pinned revision. check-pkgver otherwise rejects a pkgver() reading an
#   unpinned VCS source, because the version it declares and the version
#   makepkg resolves disagree - the builder then rebuilds it every run and
#   each rebuild replaces the published object with a byte-different one.
#   Declaring this accepts that cost; it does not avoid it.
# repo: which pacman repository the package is published into, defaulting
#   to extra. Nothing in a package declares this - membership is simply
#   which database it appears in - so it has to be stated here. core is
#   the boot-critical set and multilib the 32-bit compatibility set;
#   everything else belongs in extra, which upstream is 96% of.

