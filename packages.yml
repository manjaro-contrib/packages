# Every package this repository builds.
#
# upstream: an external git repo to track; update-upstreams opens a PR
#   when it moves ahead. Omit it for packages maintained here, which
#   have no external source.
# maintainers: requested as reviewers on those PRs.
# override: why we ship a package arch already ships. Without this,
#   check-upstream-dupes reports it as redundant, since an overlay package
#   that duplicates the distribution only decides which one pacman picks.
# patches: not a field. A directory patches/<repo-name>/ holding *.patch
#   is applied to the checkout before makepkg, and to the PKGBUILD text
#   when check_updates resolves the version. It exists for gitlab-sync
#   mirrors, which are force-pushed, so a fix committed to the package
#   repository is overwritten within two hours.
# floating: why a package must track a moving branch tip rather than a
#   pinned revision. check-pkgver otherwise rejects a pkgver() reading an
#   unpinned VCS source, because the version it declares and the version
#   makepkg resolves disagree - the builder then rebuilds it every run and
#   each rebuild replaces the published object with a byte-different one.
#   Declaring this accepts that cost; it does not avoid it.
# repo: which pacman repository the package is published into, defaulting
#   to extra. Nothing in a package declares this - membership is simply
#   which database it appears in - so it has to be stated here. core is
#   the boot-critical set and multilib the 32-bit compatibility set;
#   everything else belongs in extra, which upstream is 96% of.

packages:
  # tracked against the AUR
  bluetuith:
    upstream: https://aur.archlinux.org/bluetuith.git
    maintainers: ["boredland"]
  flashfocus:
    upstream: https://aur.archlinux.org/flashfocus.git
    maintainers: ["boredland"]
  nwg-wrapper:
    upstream: https://aur.archlinux.org/nwg-wrapper.git
    maintainers: ["boredland"]
  pacman-log-orphans-hook:
    upstream: https://aur.archlinux.org/pacman-log-orphans-hook.git
    maintainers: ["boredland"]
  pacseek:
    upstream: https://aur.archlinux.org/pacseek.git
    maintainers: ["boredland"]
  phinger-cursors:
    upstream: https://aur.archlinux.org/phinger-cursors.git
    maintainers: ["boredland"]
  poweralertd:
    upstream: https://aur.archlinux.org/poweralertd.git
    maintainers: ["boredland"]
  python-xpybutil:
    upstream: https://aur.archlinux.org/python-xpybutil.git
    maintainers: ["boredland"]
  swaycwd:
    upstream: https://aur.archlinux.org/swaycwd.git
    maintainers: ["boredland"]
  swaylock-effects:
    upstream: https://aur.archlinux.org/swaylock-effects.git
    maintainers: ["boredland"]
  swayr:
    upstream: https://aur.archlinux.org/swayr.git
    maintainers: ["boredland"]
  swayshot:
    upstream: https://aur.archlinux.org/swayshot.git
    maintainers: ["boredland"]
  sworkstyle:
    upstream: https://aur.archlinux.org/sworkstyle.git
    maintainers: ["boredland"]
  way-displays:
    upstream: https://aur.archlinux.org/way-displays.git
    maintainers: ["boredland"]
  wluma:
    upstream: https://aur.archlinux.org/wluma.git
    maintainers: ["boredland"]
  xdg-terminal-exec:
    upstream: https://aur.archlinux.org/xdg-terminal-exec.git
    maintainers: ["boredland"]
  zeit:
    upstream: https://aur.archlinux.org/zeit.git
    maintainers: ["boredland"]

  # maintained here; no external upstream
  # patched here: cloned from our mirror, gitlab.manjaro.org fails often
  # enough to break builds outright
  packages-extra-mhwd:
    repo: extra
    maintainers: ["boredland"]
  packages-extra-mhwd-db:
    repo: extra
    maintainers: ["boredland"]
  # patched here: adds our build server key to the keyring upstream ships,
  # so a client trusts what we sign without importing one by hand
  packages-core-manjaro-keyring:
    repo: core
    maintainers: ["boredland"]
  packages-extra-mhwd-ati:
    repo: extra
    maintainers: ["boredland"]
  # patched here: upstream pins a checksum against pci.ids on master, which
  # goes stale on its own; pkgver now tracks the pinned pciids commit
  packages-extra-mhwd-amdgpu:
    repo: extra
    maintainers: ["boredland"]
  # patched here: upstream's pkgver() reads the clock, and the mirror is
  # force-pushed so it cannot be fixed there. See patches/ for the diff.
  packages-core-manjaro-system:
    repo: core
    maintainers: ["boredland"]
  # mirrored from gitlab.manjaro.org by gitlab-sync, which force-pushes:
  # a downstream commit in that repository is overwritten within two hours
  packages-core-manjaro-release:
    repo: core
    maintainers: ["boredland"]
  grimshot:
    maintainers: ["boredland"]
  gtk3-nocsd:
    maintainers: ["boredland"]
  idlehack:
    maintainers: ["boredland"]
  kvantum-theme-matcha:
    maintainers: ["boredland"]
  manjaro-browser-settings:
    maintainers: ["boredland"]
  manjaro-sway-settings:
    maintainers: ["boredland"]
  manjaro-sway-settings-git:
    floating: a -git package exists to follow the branch tip; pinning it
      would duplicate manjaro-sway-settings, which tracks releases
    maintainers: ["boredland"]
  sway-services:
    maintainers: ["boredland"]
